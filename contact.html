<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto — Resoluciones Industriales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Resoluciones Industriales</a>
  </div>
</nav>

<main class="container my-5">
  <h1>Contacto</h1>
  <p>Completá el formulario y te responderemos a la brevedad.</p>

  <!-- IMPORTANTE: reemplaza el valor de action por tu endpoint de Formspree (https://formspree.io/f/yourFormId) -->
  <form action="https://formspree.io/f/yourformid" method="POST" class="row g-3">
    <div class="col-md-6">
      <label for="name" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="name" name="name" required>
    </div>
    <div class="col-md-6">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="_replyto" required>
    </div>
    <div class="col-12">
      <label for="message" class="form-label">Mensaje</label>
      <textarea id="message" name="message" rows="6" class="form-control" required></textarea>
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Enviar</button>
    </div>
  </form>

  <hr class="my-4">
  <h5>Teléfono</h5>
  <p>+54 9 XX XXX-XXXX</p>
  <h5>Dirección</h5>
  <p>Buenos Aires, Argentina</p>

</main>

<footer class="py-4 bg-dark text-white">
  <div class="container text-center">
    <p class="mb-0">© Resoluciones Industriales</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
